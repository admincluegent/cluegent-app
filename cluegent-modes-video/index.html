<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Cluegent Modes Video</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  </head>
  <body>
    <main data-composition-id="main" data-start="0" data-duration="1" data-width="1920" data-height="1080">
      <p>Render with: npx hyperframes render --composition compositions/full.html</p>
    </main>
    <script>
      const tl = window.gsap ? gsap.timeline({ paused: true }) : { duration: () => 1 };
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
